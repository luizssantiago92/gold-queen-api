name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts alembic

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Audit dependencies
        # Audit the project requirements only. A bare `pip-audit` also scans
        # packages preinstalled on the runner (such as setuptools), which are
        # not dependencies of this API.
        run: pip-audit -r requirements-dev.txt

      - name: Test
        env:
          JWT_SECRET: ci-secret-key-for-tests-0123456789abcdef
        run: pytest
