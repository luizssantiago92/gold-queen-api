name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel an older run of this workflow on the same pull request.
# Pushes use a unique group so a main run is not cancelled by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts alembic

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Audit dependencies
        # Audit the project requirements only. A bare `pip-audit` also scans
        # packages preinstalled on the runner (such as setuptools), which are
        # not dependencies of this API.
        run: pip-audit -r requirements-dev.txt

      - name: Test
        env:
          JWT_SECRET: ci-secret-key-for-tests-0123456789abcdef
        run: pytest --cov=app --cov-report=term-missing
