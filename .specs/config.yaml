# Project guardrails config. Based on .specs/config.yaml.example.
# Only deviation from the shipped defaults: Cursor IDE hooks are disabled.

schema: spec-driven

context: |
  Tech stack: (fill in)
  Test command: npm test
  Branch prefix: feat

# Cursor IDE hooks are opt-in and stay disabled for this project.
# Reinstalling the package must not re-register .cursor/hooks.json entries.
cursor:
  hooks: false

rules:
  specify:
    - Prefer EARS acceptance criteria
    - Mark unknowns with [NEEDS CLARIFICATION: question]
  tasks:
    - Every REQ must appear in the Test Coverage Matrix
  verify:
    - Evidence must cite test file:line paths

budget:
  max_iterations: 5
  max_agent_runs: 12
  max_retries_per_task: 3

scope:
  allowed_paths: []
  denied_paths:
    - "**/.env"
    - "**/secrets/**"
    - "**/production/**"

escalation:
  on_scope_expansion: human
  on_budget_exhaustion: stop
  on_policy_violation: block

effects:
  deny_delete:
    - "**/.git/**"
  deny_write: []
  deny_read: []
  warn_write: []
  warn_read: []
  warn_delete: []

memory:
  lifecycle:
    retention_days: 90
    auto_archive_on_handoff: false
  retrieval:
    semantic: false
    provider: none
    model: text-embedding-3-small
    max_chunks: 20
    fts_weight: 0.6
    semantic_weight: 0.4
    graph_depth: 1

sandbox:
  mode: "off"
  deny_patterns:
    - "rm\\s+-rf"
    - "curl.*\\|.*sh"
