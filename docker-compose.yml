services:
  db:
    image: postgres:16-alpine
    container_name: gold-queen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gold_queen
    ports:
      - "5432:5432"
    volumes:
      - gold_queen_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gold_queen"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gold_queen_data:
