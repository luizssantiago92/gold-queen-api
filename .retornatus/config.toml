schema_version = 1

[retornatus]
version = "1.9.1"

[project]
initialized = true
preset = "fastapi"

[[assurance.required_checks]]
name = "pytest"
run = [
    "uv",
    "run",
    "pytest",
    "-q",
]
types = [
    "test_result",
]

[[assurance.required_checks]]
name = "ruff"
run = [
    "uv",
    "run",
    "ruff",
    "check",
    "src",
    "app",
    "tests",
]
types = [
    "lint_result",
]

[[assurance.required_checks]]
name = "mypy"
run = [
    "uv",
    "run",
    "mypy",
]
types = [
    "lint_result",
]

[governance.scope]
code_globs = [
    "src/**",
    "app/**",
    "tests/**",
    "routers/**",
    "api/**",
    "schemas/**",
    "alembic/**",
]

[surfaces.ship]
note_subject = "ship rollback"
globs = [
    "**/Dockerfile",
    "**/docker-compose*.y*ml",
    "**/*.tf",
    "**/terraform/**",
    "**/charts/**",
    "**/helm/**",
    "**/.github/workflows/**",
    "alembic/**",
    "**/alembic/**",
]

[surfaces.ai]
note_subject = "ai fallback"
globs = [
    "**/prompts/**",
    "**/mcp/**",
    "**/evals/**",
    "**/tests/eval/**",
    "**/*llm*",
    "**/*rag*",
    "**/*embed*",
]
run = [
    "uv",
    "run",
    "pytest",
    "tests/eval",
    "-m",
    "not live",
]
# Suggested commands. verify uses these argv values when the matching
# paths are part of the Change and [[surfaces.ship.checks]] is omitted.
# Uncomment the ship tables to replace the packaged defaults entirely.
# Structural checks only: not a plan review, and not an AppSec audit.
# Eval quality is the team's job; verify only requires the command ran.
# optional = true covers the path and still requires the rollback note.
# verify does not require that command to have been executed.
